<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ご予約 | 鍼灸院node.OMIYA</title>
<style>
  :root {
    --bg: #F7F3EC;
    --surface: #FDFAF5;
    --surface2: #FFFFFF;
    --text: #2A2118;
    --text-sub: #7A6A56;
    --text-muted: #B0A090;
    --accent: #6B5A3E;
    --accent-light: #E8DFD0;
    --border: #DDD4C4;
    --border-strong: #C4B8A4;
    --radius: 4px;
    --radius-lg: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Hiragino Mincho ProN', 'Yu Mincho', 'Georgia', serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
  }
  header {
    text-align: center;
    padding: 2.5rem 1.5rem 1.5rem;
    border-bottom: 0.5px solid var(--border);
    background: var(--surface);
  }
  header p.logo {
    font-size: 1.35rem;
    letter-spacing: 0.25em;
    font-weight: 400;
    color: var(--accent);
  }
  header p.sub {
    font-size: 0.72rem;
    letter-spacing: 0.2em;
    color: var(--text-sub);
    margin-top: 0.3rem;
    font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
  }
  .container { max-width: 560px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }

  /* ステップ */
  .steps {
    display: flex;
    margin-bottom: 2rem;
    border-bottom: 0.5px solid var(--border);
    padding-bottom: 1rem;
  }
  .step {
    flex: 1;
    text-align: center;
    font-size: 0.7rem;
    font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
    color: var(--text-muted);
    letter-spacing: 0.05em;
    position: relative;
    padding-bottom: 0.75rem;
  }
  .step.active { color: var(--accent); }
  .step.active::after {
    content: '';
    position: absolute;
    bottom: -1rem;
    left: 0; right: 0;
    height: 1px;
    background: var(--accent);
  }
  .step .num { display: block; font-size: 1rem; margin-bottom: 0.2rem; font-weight: 400; }

  .section-title {
    font-size: 0.72rem;
    letter-spacing: 0.15em;
    color: var(--text-sub);
    font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
    margin-bottom: 0.75rem;
  }

  /* コース選択 */
  .course-grid { display: flex; flex-direction: column; gap: 0.6rem; margin-bottom: 2rem; }
  .course-btn {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1rem 1.25rem;
    cursor: pointer;
    text-align: left;
    transition: border-color 0.15s, background 0.15s;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .course-btn:hover { border-color: var(--border-strong); background: var(--surface2); }
  .course-btn.selected {
    border-color: var(--accent);
    background: var(--surface2);
    box-shadow: inset 0 0 0 0.5px var(--accent);
  }
  .course-btn .name { font-size: 0.95rem; color: var(--text); letter-spacing: 0.05em; }
  .course-btn .detail {
    font-size: 0.72rem; color: var(--text-sub);
    font-family: 'Hiragino Kaku Gothic ProN', sans-serif; margin-top: 0.2rem;
  }
  .course-btn .duration {
    font-size: 0.8rem; color: var(--text-sub);
    font-family: 'Hiragino Kaku Gothic ProN', sans-serif; white-space: nowrap;
  }

  /* ======= 週カレンダー ======= */
  .week-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.75rem;
  }
  .week-nav button {
    background: none;
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 0.35rem 0.75rem;
    font-size: 0.8rem;
    font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
    color: var(--text-sub);
    cursor: pointer;
    transition: border-color 0.12s;
  }
  .week-nav button:hover { border-color: var(--border-strong); }
  .week-nav button:disabled { opacity: 0.35; cursor: not-allowed; }
  .week-nav .week-label {
    font-size: 0.8rem;
    font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
    color: var(--text-sub);
    letter-spacing: 0.05em;
  }

  .cal-table {
    width: 100%;
    border-collapse: collapse;
    font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
    font-size: 0.75rem;
    margin-bottom: 1.5rem;
    overflow-x: auto;
  }
  .cal-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }

  .cal-table th {
    padding: 0.4rem 0.2rem;
    text-align: center;
    font-weight: 400;
    color: var(--text-sub);
    border-bottom: 0.5px solid var(--border);
    white-space: nowrap;
    font-size: 0.72rem;
  }
  .cal-table th.closed { color: var(--text-muted); }
  .cal-table th .dow { display: block; font-size: 0.65rem; }
  .cal-table th .date-num { display: block; font-size: 0.85rem; margin-top: 0.1rem; }

  .cal-table td {
    padding: 0.2rem 0.15rem;
    text-align: center;
    vertical-align: middle;
  }
  .cal-table td.time-col {
    color: var(--text-muted);
    font-size: 0.68rem;
    padding-right: 0.4rem;
    white-space: nowrap;
    text-align: right;
    border-right: 0.5px solid var(--border);
  }
  .cal-table td.closed-col {
    background: var(--bg);
    opacity: 0.5;
  }

  /* ○× ボタン */
  .slot-circle {
    width: 28px; height: 28px;
    border: none;
    background: transparent;
    color: var(--accent);
    font-size: 1.1rem;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.12s;
    margin: 1px auto;
  }
  .slot-circle:hover:not(.taken):not(.loading) { opacity: 0.6; }
  .slot-circle.selected { font-weight: 700; color: var(--accent); }
  .slot-circle.taken { color: var(--text-muted); cursor: not-allowed; font-size: 0.9rem; }
  .slot-circle.loading { color: var(--text-muted); cursor: default; font-size: 0.6rem; }

  .cal-legend {
    display: flex;
    gap: 1.25rem;
    margin-bottom: 1rem;
    font-size: 0.7rem;
    font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
    color: var(--text-sub);
    align-items: center;
  }
  .cal-legend-item { display: flex; align-items: center; gap: 0.4rem; }
  .cal-legend-circle {
    font-size: 1rem;
    color: var(--accent);
    line-height: 1;
  }
  .cal-legend-circle.taken { color: var(--text-muted); font-size: 0.85rem; }
  .cal-legend-circle.selected { font-weight: 700; }

  /* 選択済み表示 */
  .selected-slot-info {
    background: var(--accent-light);
    border: 0.5px solid var(--border-strong);
    border-radius: var(--radius-lg);
    padding: 0.75rem 1rem;
    font-size: 0.85rem;
    font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
    color: var(--accent);
    margin-bottom: 1rem;
    text-align: center;
    display: none;
  }

  /* フォーム */
  .form-section { margin-bottom: 2rem; }
  .form-group { margin-bottom: 1rem; }
  label {
    display: block;
    font-size: 0.72rem;
    font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
    color: var(--text-sub);
    letter-spacing: 0.1em;
    margin-bottom: 0.4rem;
  }
  input[type="text"], input[type="email"], input[type="tel"] {
    width: 100%;
    padding: 0.75rem 1rem;
    font-size: 0.95rem;
    font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
    background: var(--surface);
    color: var(--text);
    outline: none;
    transition: border-color 0.12s;
  }
  input[type="text"]:focus,
  input[type="email"]:focus,
  input[type="tel"]:focus { border-color: var(--accent); }

  .error-msg {
    font-size: 0.72rem;
    font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
    color: #A04040;
    margin-top: 0.4rem;
    display: none;
  }
  .error-msg.show { display: block; }

  /* 確認ボックス */
  .confirm-box {
    background: var(--surface2);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1.25rem;
    margin-bottom: 2rem;
  }
  .confirm-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 0.45rem 0;
    border-bottom: 0.5px solid var(--border);
    font-size: 0.88rem;
  }
  .confirm-row:last-child { border-bottom: none; }
  .confirm-row .label {
    font-size: 0.72rem;
    font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
    color: var(--text-sub);
    letter-spacing: 0.08em;
  }
  .confirm-row .val { font-size: 0.9rem; color: var(--text); text-align: right; }

  /* ボタン */
  .btn-primary {
    width: 100%;
    padding: 1rem;
    font-size: 0.9rem;
    font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
    letter-spacing: 0.15em;
    background: var(--accent);
    color: #FDFAF5;
    border: none;
    border-radius: var(--radius-lg);
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .btn-primary:hover { opacity: 0.88; }
  .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-secondary {
    width: 100%;
    padding: 0.85rem;
    font-size: 0.88rem;
    font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
    letter-spacing: 0.1em;
    background: transparent;
    color: var(--text-sub);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
    cursor: pointer;
    margin-top: 0.75rem;
    transition: border-color 0.12s;
  }
  .btn-secondary:hover { border-color: var(--border-strong); }

  /* 完了 */
  .done-screen { text-align: center; padding: 3rem 1.5rem; display: none; }
  .done-icon {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: var(--accent-light);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 1.5rem;
    font-size: 1.5rem;
  }
  .done-title { font-size: 1.1rem; letter-spacing: 0.1em; margin-bottom: 0.75rem; color: var(--accent); }
  .done-sub {
    font-size: 0.82rem;
    font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
    color: var(--text-sub);
    line-height: 1.8;
  }

  .page { display: none; }
  .page.active { display: block; }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1C1810; --surface: #252015; --surface2: #2E2818;
      --text: #EDE8DE; --text-sub: #A09070; --text-muted: #5A5040;
      --accent: #C4A97A; --accent-light: #3A3020;
      --border: #3A3020; --border-strong: #5A4E38;
    }
  }
</style>
</head>
<body>

<header>
  <p class="logo">node.OMIYA</p>
  <p class="sub">大宮</p>
</header>

<div class="container">
  <div class="steps" id="stepsBar">
    <div class="step active" id="s1"><span class="num">1</span>コース</div>
    <div class="step" id="s2"><span class="num">2</span>日時</div>
    <div class="step" id="s3"><span class="num">3</span>お客様情報</div>
    <div class="step" id="s4"><span class="num">4</span>確認</div>
  </div>

  <!-- ページ1: コース選択 -->
  <div class="page active" id="page1">
    <p class="section-title">コースをお選びください</p>
    <div class="course-grid">
      <button class="course-btn" onclick="selectCourse(this,30,'30分コース')">
        <div><div class="name">30分コース</div><div class="detail">軽めのケア・お急ぎの方に</div></div>
        <span class="duration">30 min</span>
      </button>
      <button class="course-btn" onclick="selectCourse(this,50,'50分コース')">
        <div><div class="name">50分コース</div><div class="detail">標準・全身の調整に</div></div>
        <span class="duration">50 min</span>
      </button>
      <button class="course-btn" onclick="selectCourse(this,80,'80分コース')">
        <div><div class="name">80分コース</div><div class="detail">じっくり・深いケアをご希望の方に</div></div>
        <span class="duration">80 min</span>
      </button>
    </div>
    <button class="btn-primary" id="btn1" disabled onclick="goPage(2)">次へ</button>
  </div>

  <!-- ページ2: 週カレンダー -->
  <div class="page" id="page2">
    <p class="section-title">ご希望の日時をお選びください</p>

    <div class="week-nav">
      <button id="btnPrevWeek" onclick="changeWeek(-1)" disabled>◀ 前の週</button>
      <span class="week-label" id="weekLabel"></span>
      <button id="btnNextWeek" onclick="changeWeek(1)">次の週 ▶</button>
    </div>

    <div class="cal-legend">
      <span class="cal-legend-item"><span class="cal-legend-circle">○</span>空き</span>
      <span class="cal-legend-item"><span class="cal-legend-circle taken">×</span>予約済</span>
    </div>

    <div class="cal-wrap">
      <table class="cal-table" id="calTable"></table>
    </div>

    <div class="selected-slot-info" id="selectedSlotInfo"></div>

    <button class="btn-primary" id="btn2" disabled onclick="goPage(3)">次へ</button>
    <button class="btn-secondary" onclick="goPage(1)">戻る</button>
  </div>

  <!-- ページ3: お客様情報 -->
  <div class="page" id="page3">
    <p class="section-title">お客様情報</p>
    <div class="form-section">
      <div class="form-group">
        <label>お名前</label>
        <input type="text" id="fname" placeholder="山田 花子">
        <div class="error-msg" id="err-name">お名前をご入力ください</div>
      </div>
      <div class="form-group">
        <label>メールアドレス</label>
        <input type="email" id="femail" placeholder="example@mail.com">
        <div class="error-msg" id="err-email">正しいメールアドレスをご入力ください</div>
      </div>
      <div class="form-group">
        <label>電話番号</label>
        <input type="tel" id="ftel" placeholder="090-0000-0000">
        <div class="error-msg" id="err-tel">電話番号をご入力ください</div>
      </div>
    </div>
    <button class="btn-primary" onclick="goConfirm()">内容を確認する</button>
    <button class="btn-secondary" onclick="goPage(2)">戻る</button>
  </div>

  <!-- ページ4: 確認 -->
  <div class="page" id="page4">
    <p class="section-title">予約内容の確認</p>
    <div class="confirm-box">
      <div class="confirm-row"><span class="label">コース</span><span class="val" id="c-course"></span></div>
      <div class="confirm-row"><span class="label">日付</span><span class="val" id="c-date"></span></div>
      <div class="confirm-row"><span class="label">時間</span><span class="val" id="c-time"></span></div>
      <div class="confirm-row"><span class="label">お名前</span><span class="val" id="c-name"></span></div>
      <div class="confirm-row"><span class="label">メール</span><span class="val" id="c-email"></span></div>
      <div class="confirm-row"><span class="label">電話</span><span class="val" id="c-tel"></span></div>
    </div>
    <button class="btn-primary" id="btnSubmit" onclick="submitBooking()">予約を確定する</button>
    <button class="btn-secondary" onclick="goPage(3)">戻る</button>
  </div>

  <!-- 完了 -->
  <div class="done-screen" id="doneScreen">
    <div class="done-icon">✦</div>
    <p class="done-title">ご予約を承りました</p>
    <p class="done-sub">確認メールをお送りしました。<br>ご来院をお待ちしております。<br><br>鍼灸院node.OMIYA</p>
  </div>
</div>

<script>
const BUSINESS_HOURS = {
  0: {start:10,end:17},
  1: null,
  2: null,
  3: {start:10,end:15.5},
  4: {start:10,end:17},
  5: {start:10,end:17},
  6: null,
};
const SLOT_MIN = 15;
const GAS_URL = 'https://script.google.com/macros/s/AKfycbyJA5feOcc4NbOxEgrEYARUcbhqu57O0zlalv3vX20XbUcLfdoqUr74MugHewJTnZOX/exec';
const DOW_LABEL = ['日','月','火','水','木','金','土'];

let state = { course:'', courseMin:0, date:'', time:'', name:'', email:'', tel:'' };
let weekOffset = 0;
// dateStr -> {slots:[], taken:[]}
let slotCache = {};

function selectCourse(el, min, name) {
  document.querySelectorAll('.course-btn').forEach(b=>b.classList.remove('selected'));
  el.classList.add('selected');
  state.course = name;
  state.courseMin = min;
  document.getElementById('btn1').disabled = false;
}

function goPage(n) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page'+n).classList.add('active');
  for(let i=1;i<=4;i++) document.getElementById('s'+i).classList.toggle('active', i===n);
  window.scrollTo(0,0);
  if(n===2) renderWeek();
}

// ---- 週カレンダー ----

function getWeekDates(offset) {
  const today = new Date();
  today.setHours(0,0,0,0);
  // 今週の日曜基準
  const sunday = new Date(today);
  sunday.setDate(today.getDate() - today.getDay() + offset * 7);
  const days = [];
  for(let i=0;i<7;i++){
    const d = new Date(sunday);
    d.setDate(sunday.getDate() + i);
    days.push(d);
  }
  return days;
}

function toDateStr(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function generateAllSlots(hours, durationMin) {
  const slots = [];
  let cur = hours.start * 60;
  const endMin = hours.end * 60;
  while(cur + durationMin <= endMin) {
    const h = Math.floor(cur/60), m = cur%60;
    slots.push(`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`);
    cur += SLOT_MIN;
  }
  return slots;
}

function getAllTimeSlots() {
  // 全営業日の全スロットを集めてユニーク化・ソート
  const set = new Set();
  for(const h of Object.values(BUSINESS_HOURS)) {
    if(!h) continue;
    let cur = h.start * 60;
    while(cur < h.end * 60) {
      const hh = Math.floor(cur/60), mm = cur%60;
      set.add(`${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`);
      cur += SLOT_MIN;
    }
  }
  return [...set].sort();
}

async function fetchSlots(dateStr) {
  if(slotCache[dateStr]) return slotCache[dateStr];
  const d = new Date(dateStr+'T00:00:00');
  const dow = d.getDay();
  const hours = BUSINESS_HOURS[dow];
  if(!hours) return null;

  // 前日締切チェック
  const today = new Date(); today.setHours(0,0,0,0);
  const deadline = new Date(d); deadline.setDate(d.getDate()-1);
  if(today > deadline) return null;

  try {
    const res = await fetch(`${GAS_URL}?action=slots&date=${dateStr}&course=${state.courseMin}`);
    const data = await res.json();
    slotCache[dateStr] = data;
    return data;
  } catch {
    // デモ: ランダムに埋める
    const allSlots = generateAllSlots(hours, state.courseMin);
    const taken = new Set();
    const n = Math.floor(allSlots.length * 0.3);
    while(taken.size < n) taken.add(allSlots[Math.floor(Math.random()*allSlots.length)]);
    const data = { slots: allSlots, taken: [...taken] };
    slotCache[dateStr] = data;
    return data;
  }
}

async function renderWeek() {
  const today = new Date(); today.setHours(0,0,0,0);
  const days = getWeekDates(weekOffset);
  const allTimes = getAllTimeSlots();

  // ラベル更新
  const first = days[0], last = days[6];
  document.getElementById('weekLabel').textContent =
    `${first.getMonth()+1}/${first.getDate()} 〜 ${last.getMonth()+1}/${last.getDate()}`;
  document.getElementById('btnPrevWeek').disabled = weekOffset <= 0;

  // テーブルヘッダー
  const table = document.getElementById('calTable');
  let html = '<thead><tr><th></th>';
  for(const d of days) {
    const dow = d.getDay();
    const isClosed = !BUSINESS_HOURS[dow];
    const isPast = d < today;
    const isDeadlinePast = (() => {
      const dl = new Date(d); dl.setDate(dl.getDate()-1);
      return today > dl;
    })();
    const dim = isClosed || isDeadlinePast;
    html += `<th class="${dim?'closed':''}">
      <span class="dow">${DOW_LABEL[dow]}</span>
      <span class="date-num">${d.getDate()}</span>
    </th>`;
  }
  html += '</tr></thead><tbody>';

  // ローディング状態で先に描画
  for(const time of allTimes) {
    html += `<tr><td class="time-col">${time}</td>`;
    for(const d of days) {
      const dow = d.getDay();
      const hours = BUSINESS_HOURS[dow];
      const dateStr = toDateStr(d);
      const dl = new Date(d); dl.setDate(dl.getDate()-1);
      const isDeadlinePast = today > dl;
      if(!hours || isDeadlinePast) {
        html += `<td class="closed-col"></td>`;
      } else {
        html += `<td id="cell-${dateStr}-${time}"><span class="slot-circle loading">…</span></td>`;
      }
    }
    html += '</tr>';
  }
  html += '</tbody>';
  table.innerHTML = html;

  // 各日の空き情報を並列取得して更新
  const fetchPromises = days.map(async d => {
    const dateStr = toDateStr(d);
    const dow = d.getDay();
    if(!BUSINESS_HOURS[dow]) return;
    const data = await fetchSlots(dateStr);
    if(!data) return;
    const takenSet = new Set(data.taken);
    const availableSet = new Set(data.slots);

    for(const time of allTimes) {
      const cell = document.getElementById(`cell-${dateStr}-${time}`);
      if(!cell) continue;
      if(!availableSet.has(time)) {
        cell.innerHTML = '';
        continue;
      }
      const isTaken = takenSet.has(time);
      const isSelected = state.date===dateStr && state.time===time;
      cell.innerHTML = `<span class="slot-circle${isTaken?' taken':isSelected?' selected':''}"
        ${isTaken?'':'onclick="selectSlot(\''+dateStr+'\',\''+time+'\')"'}>
        ${isTaken?'×':'○'}
      </span>`;
    }
  });

  await Promise.all(fetchPromises);
}

function changeWeek(dir) {
  weekOffset += dir;
  slotCache = {}; // キャッシュクリア
  state.date = '';
  state.time = '';
  document.getElementById('btn2').disabled = true;
  document.getElementById('selectedSlotInfo').style.display = 'none';
  renderWeek();
}

function selectSlot(dateStr, time) {
  state.date = dateStr;
  state.time = time;

  // 全セルのselectedを外して選択したものだけ付ける
  document.querySelectorAll('.slot-circle.selected').forEach(el => {
    el.classList.remove('selected');
    el.textContent = '○';
  });
  const cell = document.getElementById(`cell-${dateStr}-${time}`);
  if(cell) {
    const circle = cell.querySelector('.slot-circle');
    if(circle) { circle.classList.add('selected'); }
  }

  const d = new Date(dateStr+'T00:00:00');
  const fmt = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${DOW_LABEL[d.getDay()]}）${time}〜`;
  document.getElementById('btn2').disabled = false;
  setTimeout(() => goPage(3), 150);
}

function goConfirm() {
  const name = document.getElementById('fname').value.trim();
  const email = document.getElementById('femail').value.trim();
  const tel = document.getElementById('ftel').value.trim();
  const emailReg = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  document.getElementById('err-name').classList.toggle('show', !name);
  document.getElementById('err-email').classList.toggle('show', !emailReg.test(email));
  document.getElementById('err-tel').classList.toggle('show', !tel);
  if(!name || !emailReg.test(email) || !tel) return;
  state.name = name; state.email = email; state.tel = tel;
  const d = new Date(state.date+'T00:00:00');
  const fmt = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${DOW_LABEL[d.getDay()]}）`;
  document.getElementById('c-course').textContent = state.course;
  document.getElementById('c-date').textContent = fmt;
  document.getElementById('c-time').textContent = state.time;
  document.getElementById('c-name').textContent = state.name;
  document.getElementById('c-email').textContent = state.email;
  document.getElementById('c-tel').textContent = state.tel;
  goPage(4);
}

function submitBooking() {
  const btn = document.getElementById('btnSubmit');
  btn.disabled = true;
  btn.textContent = '送信中…';
  const body = new URLSearchParams({
    name: state.name, email: state.email, tel: state.tel,
    course: state.course, date: state.date, time: state.time,
  });
  fetch(GAS_URL, { method:'POST', body })
    .then(r=>r.json())
    .then(data=>{
      if(data.success) showDone();
      else { btn.disabled=false; btn.textContent='予約を確定する'; alert(data.message||'エラーが発生しました。'); }
    })
    .catch(()=>{ showDone(); });
}

function showDone() {
  document.getElementById('stepsBar').style.display = 'none';
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('doneScreen').style.display = 'block';
  window.scrollTo(0,0);
}
</script>
</body>
</html>
